# Zelos Extension Manifest
# See https://docs.zeloscloud.io/sdk/how-to/develop-extensions/ for full documentation

name = "OPAL-RT"
version = "0.1.2"
description = "OPAL-RT RT-LAB extension for Zelos: trace model signals and parameters, read and write them"
author = "Zelos Cloud"
repository = "https://github.com/zeloscloud/zelos-extension-opal"
homepage = "https://github.com/zeloscloud/zelos-extension-opal"
keywords = ["opal-rt", "rt-lab", "real-time", "simulation", "hil", "power-systems"]
categories = ["Simulation", "Industrial", "Protocol"]

# File references (relative paths in archive)
icon = "assets/icon.png"
readme = "README.md"

# Compatibility (optional, defaults to ^25.0.20). 26.0.4 is the first app that
# parses the [host]/[package] manifest syntax below; older ones fail on install.
[zelos]
version = ">=26.0.4"

# Configuration schema (enables UI in Zelos App)
[config]
schema = "config.schema.json"

# Host: this extension runs as an agent-side process
[host]
type = "agent"

[host.agent]
entry = "main.py"
runtime = "python"
# RT-LAB ships RtlabApi for 3.7-3.13; 3.11 is in every RT-LAB from 2023.
python_version = "3.11"

# Graceful shutdown (optional, defaults to 10). Must live under [host.agent];
# a top-level [stop] conflicts with [host.agent].
[host.agent.stop]
grace_seconds = 10

# Package contents. extension.toml, readme, icon, config schema, pyproject.toml,
# uv.lock, and actions.json are included automatically.
[package]
paths = ["main.py", "zelos_extension_opal"]
