name = "OPAL-RT"
version = "0.1.2"
description = "Trace OPAL-RT RT-LAB model signals and block parameters, and read or write control signals, parameters and MATLAB workspace variables. Runs on the RT-LAB command station through RtlabApi; a demo model needs no RT-LAB."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-opal"
# The marketplace search and Zelos AI find an extension by these words, its name and its description.
keywords = ["opal-rt", "rt-lab", "real-time", "simulation", "hil", "power-systems", "opalrt", "opal rt", "rtlab", "rt lab", "rtlabapi", "hardware in the loop", "real-time simulation", "real time", "simulink", "matlab", "control signal", "block parameter", "llp", "opcomm"]
categories = ["Simulation", "Industrial", "Protocol", "Test & Measurement"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["main.py", "zelos_extension_opal"]
